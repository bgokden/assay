[project]
name = "assay"
version = "1.3.0"
description = "Calibrated typed decisions from one forward pass of a language model"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "torch>=2.7",
    "transformers>=4.51",
    "peft>=0.15",
    "datasets>=3.0",
    "accelerate>=1.0",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "huggingface-hub>=0.30",
    "bitsandbytes>=0.50.2",
    "flash-linear-attention>=0.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assay"]
artifacts = ["assay/static/*.html"]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # the formatter would rewrite the code samples in the documentation

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
