<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay in a chat loop</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #9aa4b5; --accent: #6ea8fe; --good: #4ec9a5; --warn: #e0a95f; --bad: #e06c75;
    --human: #8b7cf0; --human-soft: #2a2545;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --line: #dde1e8; --text: #1b1f27;
      --dim: #5d6673; --accent: #2f6fd0; --good: #1f9d78; --warn: #a9701f; --bad: #c0392b;
      --human: #6355d8; --human-soft: #ece9fc;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .model { color: var(--dim); font-family: ui-monospace, monospace; font-size: 13px; }
  header .tag { margin-left: auto; color: var(--dim); font-size: 12px; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 20px 40px; }

  .conditions {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 18px;
  }
  .conditions h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 600; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .conditions dl { margin: 0; display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; }
  .conditions dt { color: var(--dim); font-size: 13px; }
  .conditions dd { margin: 0; font-size: 13px; }
  .conditions .policy { font-family: ui-monospace, monospace; font-size: 12px; }
  .conditions .foot { margin: 10px 0 0; font-size: 12px; color: var(--dim); }

  .turn { margin: 16px 0; display: flex; gap: 10px; align-items: flex-start; }
  .turn.user { flex-direction: row-reverse; }
  .col { display: flex; flex-direction: column; max-width: 82%; }
  .turn.user .col { align-items: flex-end; }
  .avatar {
    flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid;
    place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 18px;
  }
  .avatar.human { background: var(--human); }
  .avatar.bot { background: var(--accent); }
  .name { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .name .sub { font-weight: 400; color: var(--dim); font-size: 11px; margin-left: 5px; }
  .bubble {
    border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
    background: var(--panel);
  }
  .turn.user .bubble {
    background: var(--human-soft); border-color: var(--human); border-radius: 12px 12px 2px 12px;
  }
  .turn.agent .bubble { border-radius: 12px 12px 12px 2px; }
  .reply { font-size: 14px; margin: 0 0 10px; }
  .outcome {
    display: inline-flex; align-items: center; gap: 8px; font-family: ui-monospace, monospace;
    font-size: 12px; border: 1px solid var(--good); color: var(--good);
    border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
  }
  .outcome.hold { border-color: var(--warn); color: var(--warn); }
  .outcome .args { color: var(--dim); border-left: 1px solid var(--line); padding-left: 8px; }

  .steps { border-top: 1px solid var(--line); padding-top: 9px; }
  .bar {
    display: grid; grid-template-columns: 96px 1fr 46px; gap: 8px; align-items: center;
    margin: 4px 0; font-size: 12px;
  }
  .bar .key {
    color: var(--dim); font-family: ui-monospace, monospace; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .bar .track { background: var(--bg); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar .fill { background: var(--accent); height: 100%; }
  .bar .fill.hold { background: var(--warn); }
  .bar .value { text-align: right; font-family: ui-monospace, monospace; color: var(--dim); }

  .meta {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; font-size: 11px;
    font-family: ui-monospace, monospace;
  }
  .meta span { border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--dim); }
  .meta span.ms { color: var(--good); border-color: var(--good); }

  /* so the composer starts near the bottom instead of under the conditions, and the page
     does not lurch downwards as the first turns arrive */
  #transcript {
    min-height: 58vh; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .composer { display: flex; gap: 8px; margin-top: 20px; }
  .composer input {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px; font: inherit;
  }
  button.action {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.action:disabled { opacity: 0.5; cursor: default; }
  button.small {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  .composer input.typing { border-color: var(--human); }
  .composer input.typing::after { content: "|"; }
  .tools { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .error { color: var(--bad); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>Assay</h1>
  <span class="model" id="model">connecting...</span>
  <span class="tag">every reply is a decision, not generated text</span>
</header>

<main>
  <section class="conditions">
    <h2>Conditions, given once up front</h2>
    <dl id="conditions"></dl>
    <p class="foot" id="policy-note"></p>
  </section>

  <div id="transcript"></div>
  <div class="error" id="error"></div>

  <div class="composer">
    <input id="message" placeholder="Type as Mara..." autocomplete="off">
    <button class="action" id="send" onclick="send()">Send</button>
  </div>
  <div class="tools">
    <button class="small" onclick="playDemo()">play the scripted conversation</button>
    <button class="small" onclick="reset()">reset</button>
  </div>
</main>

<script>
const CONDITIONS = {
  desk: "Billing and technical support, EU store",
  customer: "Acme Ltd, Enterprise plan, account in good standing",
  order: "A-104, 240 EUR, placed 14 September",
  authority: "Refunds up to 500 EUR may be issued without a human"
};

// One template per outcome the agent can reach. The model picks the outcome; it writes none
// of this text -- that is the point.
const REPLIES = {
  issue_refund: "That is a duplicate charge, so I am refunding it now. It will be back on your card in three to five working days.",
  page_oncall: "I have paged the on-call infrastructure engineer. Someone is looking at it right now.",
  reset_access: "I have sent a password reset link to the address on the account.",
  reply: "Thanks -- I have drafted a reply for a support agent to review before it goes out.",
  over_refund_limit: "That is above the 500 EUR I am allowed to refund on my own. I am passing it to a colleague in billing with everything so far.",
  human_review: "I cannot make this call confidently, so I am passing you to a colleague."
};

const SCRIPT = [
  "I was charged twice for order A-104, that is 240 euros.",
  "Actually it is the whole annual contract, 2,400 euros.",
  "Can you confirm someone will look at it today?"
];

let agentName = null;
let history = [];

async function boot() {
  try {
    const models = await (await fetch("/v1/models")).json();
    const served = (models.models || [])[0] || {};
    document.getElementById("model").textContent =
      served.id ? `${served.id} (${served.base})` : "";
    const agents = await (await fetch("/v1/agents")).json();
    const found = agents.agents.find(a => a.name === "support-triage") || agents.agents[0];
    agentName = found.name;
    document.getElementById("policy-note").textContent =
      `Policy: the ${found.name} agent -- ${found.description}. ` +
      `${found.questions} typed questions over ${found.nodes} nodes, answered in one forward ` +
      `pass per turn. Replies are templates chosen by the outcome; the model writes no text.`;
  } catch (e) {
    document.getElementById("error").textContent = e.message;
  }
  const dl = document.getElementById("conditions");
  dl.innerHTML = Object.entries(CONDITIONS)
    .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

function escape(s) {
  return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
}

const HUMAN = {initial: "M", name: "Mara", role: "customer, Acme Ltd"};

function addUser(text) {
  document.getElementById("transcript").insertAdjacentHTML("beforeend",
    `<div class="turn user">
       <div class="avatar human">${HUMAN.initial}</div>
       <div class="col">
         <div class="name">${HUMAN.name}<span class="sub">${HUMAN.role}</span></div>
         <div class="bubble">${escape(text)}</div>
       </div>
     </div>`);
  window.scrollTo(0, document.body.scrollHeight);
}

/** Type into the composer a character at a time, the way the person would. */
async function typeInto(text, perChar = 34) {
  const input = document.getElementById("message");
  input.focus();
  input.classList.add("typing");
  input.value = "";
  for (const ch of text) {
    input.value += ch;
    await new Promise(r => setTimeout(r, perChar));
  }
  input.classList.remove("typing");
}

/** Move what was typed into the transcript, without deciding yet. */
function commit(text) {
  document.getElementById("message").value = "";
  showCustomer(text);
}

function addAgent(result, ms) {
  const held = result.action === "escalate" || !result.complete;
  const args = Object.keys(result.arguments || {}).length
    ? `<span class="args">${escape(JSON.stringify(result.arguments))}</span>` : "";
  const steps = (result.path || []).map(step => `
    <div class="bar">
      <div class="key">${escape(step.node)}</div>
      <div class="track"><div class="fill${held ? " hold" : ""}"
        style="width: ${(step.probability * 100).toFixed(1)}%"></div></div>
      <div class="value">${step.probability.toFixed(2)}</div>
    </div>`).join("");
  const usage = result.usage || {};
  const served = document.getElementById("model").textContent.split(" ")[0] || "assay";
  document.getElementById("transcript").insertAdjacentHTML("beforeend",
    `<div class="turn agent">
       <div class="avatar bot">A</div>
       <div class="col">
       <div class="name">Assay<span class="sub">${escape(served)}</span></div>
       <div class="bubble">
       <p class="reply">${escape(REPLIES[result.outcome] || result.outcome)}</p>
       <div class="outcome${held ? " hold" : ""}">${escape(result.outcome)}
         &rarr; ${escape(result.action)}${args}</div>
       <div class="steps">${steps}</div>
       <div class="meta">
         <span class="ms">${ms.toFixed(0)} ms</span>
         <span>${usage.questions || "?"} questions</span>
         <span>${usage.forward_passes || 1} forward pass</span>
         <span>path p=${(result.path_probability || 0).toFixed(3)}</span>
       </div>
     </div></div></div>`);
  window.scrollTo(0, document.body.scrollHeight);
}

async function turn(text) {
  showCustomer(text);
  await decideTurn(text);
}

function showCustomer(text) {
  addUser(text);
  history.push({from: "customer", text: text});
}

async function decideTurn(text) {
  const state = {conditions: CONDITIONS, conversation: history, latest: text};
  const started = performance.now();
  const response = await fetch(`/v1/agents/${agentName}/run`, {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({state: state})
  });
  if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
  const result = await response.json();
  const ms = performance.now() - started;
  history.push({from: "assay", decided: result.outcome});
  addAgent(result, ms);
}

async function send() {
  const input = document.getElementById("message");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  await guarded(() => turn(text));
}

async function guarded(fn) {
  const button = document.getElementById("send");
  button.disabled = true;
  document.getElementById("error").textContent = "";
  try { await fn(); } catch (e) { document.getElementById("error").textContent = e.message; }
  button.disabled = false;
}

async function playDemo() {
  reset();
  await guarded(async () => {
    await turn("warming up");   // the first request after a restart pays for the CUDA graphs
    reset();
    for (const line of SCRIPT) {
      await typeInto(line);
      await new Promise(r => setTimeout(r, 350));
      commit(line);
      await new Promise(r => setTimeout(r, 250));
      await decideTurn(line);
      await new Promise(r => setTimeout(r, 1100));
    }
    document.getElementById("message").blur();
  });
}

function reset() {
  history = [];
  document.getElementById("transcript").innerHTML = "";
  document.getElementById("error").textContent = "";
}

document.getElementById("message").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});
boot();
</script>
</body>
</html>
