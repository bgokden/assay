<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assay</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e9ef;
    --dim: #9aa4b5; --accent: #6ea8fe; --good: #4ec9a5; --warn: #e0a95f; --bad: #e06c75;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --line: #dde1e8; --text: #1b1f27;
      --dim: #5d6673; --accent: #2f6fd0; --good: #1f9d78; --warn: #a9701f; --bad: #c0392b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  header .model { color: var(--dim); font-family: ui-monospace, monospace; font-size: 13px; }
  header .spacer { flex: 1; }
  .tabs { display: flex; gap: 4px; padding: 10px 20px 0; }
  .tabs button {
    background: none; border: 1px solid transparent; border-bottom: none; color: var(--dim);
    padding: 8px 14px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 14px;
  }
  .tabs button.on { color: var(--text); background: var(--panel); border-color: var(--line); }
  main { padding: 0 20px 40px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 0 10px 10px 10px;
    padding: 18px; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
    gap: 20px;
  }
  @media (max-width: 860px) { .panel { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  textarea, input, select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, monospace; }
  button.action {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.action:disabled { opacity: 0.55; cursor: default; }
  button.small {
    background: none; border: 1px solid var(--line); color: var(--dim);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .question { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0; }
  .question .row + .row { margin-top: 8px; }
  .answer { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0; }
  .answer h3 { margin: 0 0 4px; font-size: 14px; font-family: ui-monospace, monospace; }
  .answer .verdict { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 58px; gap: 8px; align-items: center;
         margin: 4px 0; font-size: 13px; }
  .bar .key { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { background: var(--bg); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar .fill { background: var(--accent); height: 100%; }
  .bar .value { text-align: right; font-family: ui-monospace, monospace; color: var(--dim); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--dim); font-family: ui-monospace, monospace;
  }
  .badge.act { color: var(--good); border-color: var(--good); }
  .badge.hold { color: var(--warn); border-color: var(--warn); }
  .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  .error { color: var(--bad); font-size: 13px; white-space: pre-wrap; margin-top: 10px; }
  .path { border-left: 2px solid var(--line); margin: 10px 0 0 6px; padding-left: 14px; }
  .path .step { margin: 8px 0; font-size: 13px; }
  .path .step .node { font-family: ui-monospace, monospace; }
  .path .step .guard { color: var(--warn); }
  .outcome { font-size: 18px; font-weight: 600; margin: 6px 0; }
  .outcome .action { font-family: ui-monospace, monospace; color: var(--accent); font-size: 15px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px;
        overflow: auto; font-size: 12px; max-height: 320px; }
</style>
</head>
<body>
<header>
  <h1>Assay</h1>
  <span class="model" id="model">connecting...</span>
  <span class="spacer"></span>
  <input id="key" placeholder="API key, if the server needs one" style="width: 240px">
</header>

<div class="tabs">
  <button id="tab-decide" class="on" onclick="showTab('decide')">Questions</button>
  <button id="tab-agent" onclick="showTab('agent')">Agents</button>
</div>

<main>
  <section id="panel-decide" class="panel">
    <div>
      <label for="state">State: the text or JSON the questions are asked about</label>
      <textarea id="state"></textarea>
      <div class="row" style="margin-top: 10px">
        <button class="small" onclick="loadExample('refund')">refund example</button>
        <button class="small" onclick="loadExample('outage')">outage example</button>
        <button class="small" onclick="loadExample('empty')">clear</button>
      </div>
      <div style="margin-top: 18px">
        <div class="row"><label style="margin:0">Questions</label>
          <span class="spacer"></span>
          <button class="small" onclick="addQuestion('bool')">add bool</button>
          <button class="small" onclick="addQuestion('choice')">add choice</button>
          <button class="small" onclick="addQuestion('score')">add score</button>
        </div>
        <div id="questions"></div>
      </div>
      <button class="action" id="decide" onclick="decide()">Decide</button>
      <div class="note" id="usage"></div>
      <div class="error" id="decide-error"></div>
    </div>
    <div>
      <label>Answers</label>
      <div id="answers"><div class="note">No answers yet. Every question is answered in one
        forward pass over the state.</div></div>
    </div>
  </section>

  <section id="panel-agent" class="panel" style="display: none">
    <div>
      <label for="agent">Agent</label>
      <select id="agent" onchange="describeAgent()"></select>
      <div class="note" id="agent-description"></div>
      <label for="agent-state" style="margin-top: 16px">State</label>
      <textarea id="agent-state"></textarea>
      <div class="row" style="margin-top: 10px">
        <button class="small" onclick="loadExample('refund', true)">refund example</button>
        <button class="small" onclick="loadExample('outage', true)">outage example</button>
      </div>
      <button class="action" id="run" onclick="runAgent()" style="margin-top: 12px">Run</button>
      <div class="note" id="agent-usage"></div>
      <div class="error" id="agent-error"></div>
    </div>
    <div>
      <label>Decision</label>
      <div id="agent-result"><div class="note">Agents registered on this server appear in the
        list. The server decides and says what to do; it never performs the action.</div></div>
    </div>
  </section>
</main>

<script>
const EXAMPLES = {
  refund: {
    state: {channel: "email", message: "I was charged twice for order A-104 last week and the second charge is still there. Please refund it."},
    questions: [
      {name: "route", type: "choice", instructions: "Which team should handle this ticket?",
       options: {billing: "Charges, invoices and refunds", technical: "Faults and outages", account: "Sign-in and profile"}},
      {name: "refund_requested", type: "bool", instructions: "Is the customer asking for money back?"},
      {name: "urgency", type: "score", instructions: "How urgent is this ticket?",
       levels: ["Can wait", "Needs attention today", "Blocking work right now"]}
    ]
  },
  outage: {
    state: {channel: "email", message: "The dashboard has been down for the whole team since this morning and nobody can log in."},
    questions: [
      {name: "route", type: "choice", instructions: "Which team should handle this ticket?",
       options: {billing: "Charges, invoices and refunds", technical: "Faults and outages", account: "Sign-in and profile"}},
      {name: "outage", type: "bool", instructions: "Does this describe an outage affecting several people?"},
      {name: "urgency", type: "score", instructions: "How urgent is this ticket?",
       levels: ["Can wait", "Needs attention today", "Blocking work right now"]}
    ]
  },
  empty: {state: "", questions: []}
};

let questionCount = 0;

function headers() {
  const h = {"content-type": "application/json"};
  const key = document.getElementById("key").value.trim();
  if (key) h["authorization"] = "Bearer " + key;
  return h;
}

async function call(path, body) {
  const options = body === undefined
    ? {headers: headers()}
    : {method: "POST", headers: headers(), body: JSON.stringify(body)};
  const response = await fetch(path, options);
  const text = await response.text();
  let payload;
  try { payload = JSON.parse(text); } catch (e) { payload = {detail: text}; }
  if (!response.ok) {
    throw new Error(typeof payload.detail === "string" ? payload.detail : JSON.stringify(payload.detail || payload));
  }
  return payload;
}

function showTab(which) {
  for (const name of ["decide", "agent"]) {
    document.getElementById("panel-" + name).style.display = name === which ? "grid" : "none";
    document.getElementById("tab-" + name).classList.toggle("on", name === which);
  }
}

function addQuestion(type, filled) {
  const id = "q" + (++questionCount);
  const node = document.createElement("div");
  node.className = "question";
  node.id = id;
  node.dataset.type = type;
  const name = filled ? filled.name : (type === "bool" ? "is_" : type) + questionCount;
  let extra = "";
  if (type === "choice") {
    const options = filled && filled.options
      ? Object.entries(filled.options).map(([k, v]) => k + ": " + v).join("\n")
      : "first: what this option means\nsecond: what that one means";
    extra = `<div class="row"><textarea data-role="options" style="min-height:70px">${escapeHtml(options)}</textarea></div>
             <div class="note">One option per line, as <code>key: description</code>.</div>`;
  } else if (type === "score") {
    const levels = filled && filled.levels ? filled.levels.join("\n") : "Low\nMedium\nHigh";
    extra = `<div class="row"><textarea data-role="levels" style="min-height:70px">${escapeHtml(levels)}</textarea></div>
             <div class="note">One level per line, lowest first.</div>`;
  }
  node.innerHTML = `
    <div class="row">
      <input data-role="name" value="${escapeHtml(name)}" style="width: 150px" placeholder="name">
      <span class="badge">${type}</span>
      <span class="spacer" style="flex:1"></span>
      <button class="small" onclick="this.closest('.question').remove()">remove</button>
    </div>
    <div class="row"><input data-role="instructions" placeholder="What are you asking?"
      value="${escapeHtml(filled ? filled.instructions : "")}"></div>
    ${extra}`;
  document.getElementById("questions").appendChild(node);
}

function escapeHtml(value) {
  return String(value === undefined || value === null ? "" : value)
    .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
}

function loadExample(which, forAgent) {
  const example = EXAMPLES[which];
  const state = typeof example.state === "string" ? example.state : JSON.stringify(example.state, null, 2);
  if (forAgent) { document.getElementById("agent-state").value = state; return; }
  document.getElementById("state").value = state;
  document.getElementById("questions").innerHTML = "";
  questionCount = 0;
  for (const q of example.questions) addQuestion(q.type, q);
}

function readState(id) {
  const raw = document.getElementById(id).value.trim();
  if (!raw) throw new Error("the state is empty");
  if (raw.startsWith("{") || raw.startsWith("[")) {
    try { return JSON.parse(raw); } catch (e) { throw new Error("the state looks like JSON but does not parse: " + e.message); }
  }
  return raw;
}

function readQuestions() {
  const out = {};
  for (const node of document.querySelectorAll("#questions .question")) {
    const get = (role) => {
      const field = node.querySelector(`[data-role="${role}"]`);
      return field ? field.value.trim() : "";
    };
    const name = get("name");
    if (!name) throw new Error("every question needs a name");
    const question = {type: node.dataset.type, instructions: get("instructions")};
    if (!question.instructions) throw new Error(`question "${name}" has no instructions`);
    if (node.dataset.type === "choice") {
      const options = {};
      for (const line of get("options").split("\n")) {
        if (!line.trim()) continue;
        const at = line.indexOf(":");
        const key = (at === -1 ? line : line.slice(0, at)).trim();
        options[key] = at === -1 ? null : line.slice(at + 1).trim();
      }
      if (Object.keys(options).length < 2) throw new Error(`question "${name}" needs at least two options`);
      question.options = options;
    } else if (node.dataset.type === "score") {
      const levels = get("levels").split("\n").map((l) => l.trim()).filter(Boolean);
      if (levels.length < 2) throw new Error(`question "${name}" needs at least two levels`);
      question.levels = levels;
    }
    out[name] = question;
  }
  if (!Object.keys(out).length) throw new Error("add at least one question");
  return out;
}

function bars(probabilities, legend) {
  const entries = Object.entries(probabilities);
  return entries.map(([key, value]) => {
    const label = legend && legend[key] ? `${key} - ${legend[key]}` : key;
    return `<div class="bar"><div class="key" title="${escapeHtml(label)}">${escapeHtml(label)}</div>
      <div class="track"><div class="fill" style="width:${(value * 100).toFixed(1)}%"></div></div>
      <div class="value">${value.toFixed(3)}</div></div>`;
  }).join("");
}

function answerCard(name, answer) {
  let verdict = "";
  if (answer.type === "bool") verdict = `p(yes) = ${answer.p_true.toFixed(3)}`;
  else if (answer.type === "choice") verdict = `choice: ${answer.choice}`;
  else verdict = `score ${answer.score.toFixed(2)} (level ${answer.level})`;
  const badges = [`<span class="badge">confidence ${answer.confidence.toFixed(2)}</span>`,
                  `<span class="badge">evidence ${answer.evidence.toFixed(2)}</span>`];
  if (answer.act !== undefined) {
    badges.push(answer.act
      ? `<span class="badge act">act</span>`
      : `<span class="badge hold">hand over</span>`);
  }
  if (answer.set) badges.push(`<span class="badge">set: ${answer.set.join(", ")}</span>`);
  return `<div class="answer"><h3>${escapeHtml(name)}</h3>
    <div class="verdict">${escapeHtml(verdict)}</div>
    ${bars(answer.probabilities, answer.legend)}
    <div class="badges">${badges.join("")}</div></div>`;
}

async function decide() {
  const button = document.getElementById("decide");
  const error = document.getElementById("decide-error");
  error.textContent = "";
  button.disabled = true;
  try {
    const body = {state: readState("state"), questions: readQuestions()};
    const result = await call("/v1/decide", body);
    document.getElementById("answers").innerHTML =
      Object.entries(result.answers).map(([name, a]) => answerCard(name, a)).join("");
    const count = Object.keys(result.answers).length;
    document.getElementById("usage").textContent =
      `${count} question${count === 1 ? "" : "s"} in one forward pass, ` +
      `${result.usage.input_tokens} input tokens, ${result.latency_ms} ms`;
  } catch (e) {
    error.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

async function loadAgents() {
  const select = document.getElementById("agent");
  try {
    const result = await call("/v1/agents");
    select.innerHTML = "";
    if (!result.agents.length) {
      select.innerHTML = `<option value="">no agents registered</option>`;
      document.getElementById("agent-description").textContent =
        "Start the server with --agents <directory>, or POST a specification to /v1/agents.";
      return;
    }
    for (const agent of result.agents) {
      const option = document.createElement("option");
      option.value = agent.name;
      option.textContent = agent.name;
      option.dataset.description = agent.description || "";
      option.dataset.questions = agent.questions;
      option.dataset.nodes = agent.nodes;
      select.appendChild(option);
    }
    describeAgent();
  } catch (e) {
    select.innerHTML = `<option value="">could not list agents</option>`;
    document.getElementById("agent-error").textContent = e.message;
  }
}

function describeAgent() {
  const option = document.getElementById("agent").selectedOptions[0];
  if (!option || !option.dataset.questions) return;
  document.getElementById("agent-description").textContent =
    `${option.dataset.description} (${option.dataset.nodes} nodes, ` +
    `${option.dataset.questions} questions in one pass)`;
}

async function runAgent() {
  const button = document.getElementById("run");
  const error = document.getElementById("agent-error");
  error.textContent = "";
  button.disabled = true;
  try {
    const name = document.getElementById("agent").value;
    if (!name) throw new Error("no agent selected");
    const result = await call(`/v1/agents/${encodeURIComponent(name)}/run`, {state: readState("agent-state")});
    const action = result.action
      ? `<div class="outcome">then <span class="action">${escapeHtml(result.action)}</span>
         ${result.arguments && Object.keys(result.arguments).length
            ? `<span class="badge">${escapeHtml(JSON.stringify(result.arguments))}</span>` : ""}</div>`
      : `<div class="note">This outcome has no action attached.</div>`;
    const steps = result.path.map((step) => `
      <div class="step"><span class="node">${escapeHtml(step.node)}</span>
        chose <strong>${escapeHtml(step.chosen)}</strong>
        at p=${step.probability.toFixed(2)}, evidence ${step.evidence.toFixed(2)}
        ${step.guard ? `<div class="guard">guard: ${escapeHtml(step.guard)}</div>` : ""}</div>`).join("");
    document.getElementById("agent-result").innerHTML = `
      <div class="outcome">${escapeHtml(String(result.outcome))}</div>
      ${action}
      <div class="note">path probability ${result.path_probability.toFixed(3)}</div>
      <div class="path">${steps}</div>
      <details style="margin-top:12px"><summary class="note">every answer</summary>
        <pre>${escapeHtml(JSON.stringify(result.answers, null, 2))}</pre></details>`;
    document.getElementById("agent-usage").textContent =
      `${result.usage.questions} questions, ${result.usage.forward_passes} forward pass, ` +
      `${result.latency_ms} ms`;
  } catch (e) {
    error.textContent = e.message;
  } finally {
    button.disabled = false;
  }
}

async function start() {
  try {
    const models = await call("/v1/models");
    const model = models.models[0];
    document.getElementById("model").textContent = model.base ? `${model.id} (${model.base})` : model.id;
  } catch (e) {
    document.getElementById("model").textContent = "could not reach the server";
  }
  loadExample("refund");
  loadAgents();
}

start();
</script>
</body>
</html>
